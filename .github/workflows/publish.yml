name: Publish npm package

# Manual: add a repository secret NPM_TOKEN (npm Automation token), then run this
# workflow from the Actions tab. It publishes the tarball attached to the release.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag holding percho-workbench-<version>.tgz
        required: true
        default: v0.1.0

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Download release tarball and checksum
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: gh release download "$TAG" --repo "${{ github.repository }}" --pattern "percho-workbench-*.tgz*" --dir dist
      - name: Verify tarball matches its checksum
        run: cd dist && sha256sum -c ./*.sha256
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish ./dist/percho-workbench-0.1.0.tgz